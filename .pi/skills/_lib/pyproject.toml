[project]
name = "vault"
version = "0.1.0"
description = "Librería compartida para el asistente de productividad diaria (auto_vault)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]

[tool.pytest.ini_options]
testpaths = ["tests", ".."]
python_files = ["test_*.py"]
addopts = "-q"
